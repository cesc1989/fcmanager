AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    - "config/db/**/*"
    - "db/**/*"
    - "bin/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "spec/spec_helper.rb"
    - test_models.rb
  NewCops: disable # see https://docs.rubocop.org/rubocop/versioning.html#pending-cops

Bundler/OrderedGems:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/AccessorGrouping:
  Enabled: false

Style/KeywordParametersOrder:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/HashSyntax:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 130

Layout/SpaceInsideHashLiteralBraces:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Naming/VariableNumber:
  Enabled: false
