include:
- "**/*.rb"
exclude:
- vendor/**/*
- ".bundle/**/*"
- config/db/**/*
- db/**/*
- tmp/**/*
- log/**/*
- public/**/*
- node_modules/**/*
- test_models.rb
require: []
domains: []
reporters:
- rubocop
- require_not_found
formatter:
  rubocop:
    cops: safe
    except: []
    only: []
    extra_args: []
require_paths: []
plugins: []
max_files: 5000
